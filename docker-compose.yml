# ==============================================================================
# 路书 (LuShu) - Docker Compose 容器编排
# 运行方式：
#   docker compose up -d --build
# 停止方式：
#   docker compose down
services:
  lushu:
    build:
      context: .
      dockerfile: Dockerfile
    image: lushu:latest
    container_name: lushu
    restart: always
    ports:
      # 宿主机端口 : 容器端口（如果云服务器 8123 端口被占用，可修改左侧，例如 "8080:8123"）
      - "8123:8123"
    volumes:
      # SQLite 数据库持久化目录（存放用户与路书数据）
      - ./data:/app/data
      # 代码与静态资源热更新挂载（宿主机文件覆盖即生效，无需重新构建镜像）
      - ./index.html:/app/index.html
      - ./server.py:/app/server.py
      - ./css:/app/css
      - ./js:/app/js
      - ./vendor:/app/vendor
    environment:
      - HOST=0.0.0.0
      - PORT=8123
      - DATA_DIR=/app/data
      - SERVER_NO_OPEN=1
